<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#151210" />
<meta name="description" content="Roteiro, dicas, lugares e atrações da viagem em família a Orlando." />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<!-- iOS usa isso (não o <title>) como nome pré-preenchido ao "Adicionar à
     Tela de Início" — sem essa tag, o Safari cai pro <title> da página. -->
<meta name="apple-mobile-web-app-title" content="Family Trip" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<title>Family Trip</title>
<style>
  /* Ícone do app + barra de progresso indeterminada, centralizados na tela,
     mostrados enquanto o app ainda não montou (PWA abrindo a frio: tela
     fica em branco por um tempo até o JS carregar e rodar). Puro CSS/HTML,
     sem depender de nenhum bundle — precisa aparecer instantaneamente,
     antes de qualquer JS rodar. Removido por main.jsx assim que o React
     monta de verdade. */
  #boot-progress {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    z-index: 9999;
  }
  #boot-progress img {
    width: 56px;
    height: 56px;
    border-radius: 16px;
  }
  #boot-progress .bar {
    position: relative;
    width: 140px;
    height: 4px;
    border-radius: 2px;
    background: rgba(28, 26, 23, 0.1);
    overflow: hidden;
  }
  #boot-progress .bar::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 45%;
    background: #1c1a17;
    border-radius: 2px;
    animation: boot-progress-slide 1.1s ease-in-out infinite;
  }
  @keyframes boot-progress-slide {
    0% { left: -45%; }
    100% { left: 100%; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-progress">
  <img src="/icons/icon-192.png" alt="" />
  <div class="bar"></div>
</div>
<script>
  // Watchdog de boot: roda ANTES do bundle principal (/src/main.jsx), como
  // script inline puro — se o bundle nunca carregar/executar de verdade
  // (ex: um Service Worker antigo servindo um index.html desatualizado via
  // precache, que referencia um JS que já não corresponde mais ao restante
  // do app), um setTimeout dentro do próprio bundle nunca dispararia, pois
  // o bundle em si é o que está travado/nunca roda. Isso precisa viver fora
  // dele. Se a tela de boot (ver #boot-progress acima) ainda estiver visível
  // depois de alguns segundos, nada montou — desregistra o Service Worker,
  // limpa os Caches Storage (incluindo o precache do Workbox, que pode estar
  // com um manifesto antigo incompatível) e recarrega uma única vez, sem
  // depender do usuário ver/clicar em nenhum banner. A flag em
  // sessionStorage evita um loop infinito de reload caso o problema seja
  // outro (ex: perda de rede persistente) — tenta só uma vez por sessão.
  (function () {
    var TIMEOUT_MS = 8000;
    var RETRY_FLAG = 'bootWatchdogRetried';

    setTimeout(function () {
      var bootEl = document.getElementById('boot-progress');
      if (!bootEl || !document.body.contains(bootEl)) return; // já montou normalmente

      if (sessionStorage.getItem(RETRY_FLAG)) return; // já tentou uma vez nesta sessão, evita loop
      sessionStorage.setItem(RETRY_FLAG, '1');

      Promise.resolve()
        .then(function () {
          if (!('serviceWorker' in navigator)) return;
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          });
        })
        .then(function () {
          if (!('caches' in window)) return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        })
        .finally(function () {
          location.reload();
        });
    }, TIMEOUT_MS);
  })();
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
